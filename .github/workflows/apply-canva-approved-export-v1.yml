name: Apply Canva approved export v1

on:
  push:
    branches:
      - agent/canva-approved-export-v1
    paths:
      - scripts/apply-canva-approved-export-v1.mjs
      - .github/workflows/apply-canva-approved-export-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canva-approved-export-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration wiring
        run: node scripts/apply-canva-approved-export-v1.mjs
      - name: Remove temporary wiring files
        run: rm scripts/apply-canva-approved-export-v1.mjs .github/workflows/apply-canva-approved-export-v1.yml
      - name: Commit generated integration
        run: |
          git config user.name "MODO Product"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: connect Canva after content approval"
          git push origin HEAD:agent/canva-approved-export-v1
