name: Patch activation retrocompatibility

on:
  push:
    branches:
      - feat/activation-core-v1
    paths:
      - scripts/patch-activation-retro.mjs
      - .github/workflows/patch-activation-retro.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/activation-core-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-activation-retro.mjs
      - name: Commit clean result
        run: |
          git config user.name "modo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/services/activation-service.ts scripts/patch-activation-retro.mjs .github/workflows/patch-activation-retro.yml
          git commit -m "fix: preserve activation progress for existing users"
          git push origin HEAD:feat/activation-core-v1
