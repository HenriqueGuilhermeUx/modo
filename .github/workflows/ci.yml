name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: modo_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d modo_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: API startup smoke
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/modo-api-startup.log"
          PORT=4010 NODE_ENV=test npm run start --workspace=@modo/api >"${LOG_FILE}" 2>&1 &
          API_PID=$!
          cleanup() {
            kill "${API_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4010/health" >/dev/null; then
              echo "MODO API iniciou sem colisão de rotas."
              exit 0
            fi
            if ! kill -0 "${API_PID}" 2>/dev/null; then
              echo "MODO API encerrou durante o startup:"
              cat "${LOG_FILE}"
              exit 1
            fi
            sleep 1
          done

          echo "MODO API não ficou saudável dentro do tempo esperado:"
          cat "${LOG_FILE}"
          exit 1

      - name: Publisher V2 PostgreSQL startup smoke
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/modo_ci
          DATABASE_SSL: "false"
          PORT: "4011"
          NODE_ENV: test
          PUBLIC_API_URL: http://127.0.0.1:4011
          PUBLIC_WEB_URL: http://127.0.0.1:5173
          ALLOWED_ORIGINS: http://127.0.0.1:5173
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/modo-api-publisher-v2-postgres.log"
          npm run start --workspace=@modo/api >"${LOG_FILE}" 2>&1 &
          API_PID=$!
          cleanup() {
            kill "${API_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --fail --silent "http://127.0.0.1:4011/health" >/dev/null && \
               curl --fail --silent "http://127.0.0.1:4011/api/v2/publisher/health" >/dev/null; then
              echo "MODO Publisher V2 iniciou com PostgreSQL e criou a infraestrutura persistente."
              exit 0
            fi
            if ! kill -0 "${API_PID}" 2>/dev/null; then
              echo "MODO API encerrou durante o startup do Publisher V2:"
              cat "${LOG_FILE}"
              exit 1
            fi
            sleep 1
          done

          echo "MODO Publisher V2 não ficou saudável com PostgreSQL:"
          cat "${LOG_FILE}"
          exit 1
