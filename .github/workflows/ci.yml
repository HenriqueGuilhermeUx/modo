name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: modo_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d modo_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: MODO Video render smoke
        run: npm run smoke:video --workspace=@modo/api

      - name: API startup smoke
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/modo-api-startup.log"
          PORT=4010 NODE_ENV=test npm run start --workspace=@modo/api >"${LOG_FILE}" 2>&1 &
          API_PID=$!
          cleanup() {
            kill "${API_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4010/health" >/dev/null; then
              echo "MODO API iniciou sem colisão de rotas."
              exit 0
            fi
            if ! kill -0 "${API_PID}" 2>/dev/null; then
              echo "MODO API encerrou durante o startup:"
              cat "${LOG_FILE}"
              exit 1
            fi
            sleep 1
          done

          echo "MODO API não ficou saudável dentro do tempo esperado:"
          cat "${LOG_FILE}"
          exit 1

      - name: Publisher V2 PostgreSQL startup smoke
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/modo_ci
          DATABASE_SSL: "false"
          PORT: "4011"
          NODE_ENV: test
          PUBLIC_API_URL: http://127.0.0.1:4011
          PUBLIC_WEB_URL: http://127.0.0.1:5173
          ALLOWED_ORIGINS: http://127.0.0.1:5173
          INSTAGRAM_CLIENT_ID: ci-instagram-client
          INSTAGRAM_CLIENT_SECRET: ci-instagram-secret
          INSTAGRAM_TOKEN_ENCRYPTION_SECRET: ci-instagram-encryption-secret
          INSTAGRAM_PUBLISHER_REDIRECT_URI: http://127.0.0.1:4011/api/v2/publisher/oauth/instagram/callback
          LINKEDIN_CLIENT_ID: ci-linkedin-client
          LINKEDIN_CLIENT_SECRET: ci-linkedin-secret
          LINKEDIN_TOKEN_ENCRYPTION_SECRET: ci-linkedin-encryption-secret
          LINKEDIN_PUBLISHER_REDIRECT_URI: http://127.0.0.1:4011/api/v2/publisher/oauth/linkedin/callback
          GOOGLE_ADS_CLIENT_ID: ci-google-ads-client
          GOOGLE_ADS_CLIENT_SECRET: ci-google-ads-secret
          GOOGLE_ADS_REDIRECT_URI: http://127.0.0.1:4011/api/v1/internal/nexoffice/marketing/v1/media/google_ads/oauth/callback
          GOOGLE_ADS_TOKEN_ENCRYPTION_SECRET: ci-google-ads-encryption-secret-0123456789
          GOOGLE_ADS_API_VERSION: v25
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/modo-api-publisher-v2-postgres.log"
          npm run start --workspace=@modo/api >"${LOG_FILE}" 2>&1 &
          API_PID=$!
          cleanup() {
            kill "${API_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --fail --silent "http://127.0.0.1:4011/health" >/dev/null; then
              PUBLISHER_HEALTH="$(curl --fail --silent "http://127.0.0.1:4011/api/v2/publisher/health" || true)"
              LINKEDIN_HEALTH="$(curl --fail --silent "http://127.0.0.1:4011/api/v2/publisher/linkedin/health" || true)"
              GOOGLE_ADS_HEALTH="$(curl --fail --silent "http://127.0.0.1:4011/api/v1/google-ads/readiness" || true)"
              if printf '%s' "${PUBLISHER_HEALTH}" | grep -q '"directInstagramOAuth":true' && \
                 printf '%s' "${PUBLISHER_HEALTH}" | grep -q 'api/v2/publisher/oauth/instagram/callback' && \
                 printf '%s' "${LINKEDIN_HEALTH}" | grep -q '"configured":true' && \
                 printf '%s' "${LINKEDIN_HEALTH}" | grep -q 'api/v2/publisher/oauth/linkedin/callback' && \
                 printf '%s' "${GOOGLE_ADS_HEALTH}" | grep -q '"configured":true' && \
                 printf '%s' "${GOOGLE_ADS_HEALTH}" | grep -q '"apiVersion":"v25"' && \
                 printf '%s' "${GOOGLE_ADS_HEALTH}" | grep -q '"externalCampaignActivation":false'; then
                echo "MODO iniciou com PostgreSQL, OAuth social e Google Ads readiness protegida por governança."
                exit 0
              fi
            fi
            if ! kill -0 "${API_PID}" 2>/dev/null; then
              echo "MODO API encerrou durante o startup do Publisher V2:"
              cat "${LOG_FILE}"
              exit 1
            fi
            sleep 1
          done

          echo "MODO Publisher V2/Google Ads não ficou saudável com PostgreSQL/OAuth:"
          cat "${LOG_FILE}"
          exit 1
