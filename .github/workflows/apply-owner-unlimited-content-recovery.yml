name: Apply owner unlimited and content recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/owner-unlimited-content-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Apply owner and content recovery patch to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PATCH_BRANCH: agent/owner-unlimited-content-recovery
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git fetch --quiet origin "${PATCH_BRANCH}"
          mkdir -p scripts .github/workflows
          git show FETCH_HEAD:scripts/apply-owner-unlimited-content-recovery.mjs > scripts/apply-owner-unlimited-content-recovery.mjs
          touch .github/workflows/apply-owner-unlimited-content-recovery.yml
          node scripts/apply-owner-unlimited-content-recovery.mjs
          git config user.name "MODO Product"
          git config user.email "actions@github.com"
          git add apps/api/src/services/billing-service.ts apps/api/src/services/content-service.ts apps/api/src/services/content-automation-service.ts apps/web/src/ProductionProgress.tsx
          if git diff --cached --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git commit -m "fix: unlimited owner and resilient content production"
          git push origin HEAD:main
