name: Validate MODO Production AAB

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eas-build-production-validation.yml"

concurrency:
  group: modo-production-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-production-aab:
    name: Build MODO Production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install and validate monorepo
        run: |
          npm install --include=dev
          npm run typecheck
          npm test

      - name: Verify Expo account and project
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          eas whoami
          eas project:info --non-interactive

      - name: Build production AAB on EAS
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          EXPO_NO_TELEMETRY: "1"
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --clear-cache \
            --wait \
            --json > eas-build-production.json

          cat eas-build-production.json
          ARTIFACT_URL=$(node -e "const fs=require('fs');const raw=fs.readFileSync('eas-build-production.json','utf8').trim();const indexes=[raw.indexOf('['),raw.indexOf('{')].filter(i=>i>=0);const start=Math.min(...indexes);const data=JSON.parse(raw.slice(start));const build=Array.isArray(data)?data[0]:data;const url=build?.artifacts?.buildUrl||build?.artifacts?.applicationArchiveUrl;if(!url){console.error(raw);process.exit(1)};process.stdout.write(url)")
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download AAB
        working-directory: apps/mobile
        run: |
          mkdir -p artifacts
          curl --fail --location "${{ steps.build.outputs.artifact_url }}" --output artifacts/MODO-1.0.0-play-store.aab
          test -s artifacts/MODO-1.0.0-play-store.aab
          sha256sum artifacts/MODO-1.0.0-play-store.aab
          ls -lh artifacts/MODO-1.0.0-play-store.aab

      - name: Upload AAB to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MODO-Production-AAB-${{ github.run_number }}
          path: apps/mobile/artifacts/MODO-1.0.0-play-store.aab
          if-no-files-found: error
          retention-days: 30
