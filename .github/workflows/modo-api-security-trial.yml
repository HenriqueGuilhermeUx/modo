name: MODO API security trial
on:
  push:
    branches: ['security/modo-api-remotion-zod-20261026']
  pull_request:
    branches: ['feat/hyperframes-pilot-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: modo_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d modo_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies in disposable runner
        run: npm install --include=dev --no-audit --no-fund
      - name: Verify exact resolved API package versions
        run: node scripts/modo-api-security-version-check.cjs
      - name: Typecheck all MODO workspaces
        run: npm run typecheck
      - name: Run API regression tests
        run: npm test
      - name: Build all current web and API packages
        run: npm run build
      - name: Test original Remotion render
        run: npm run smoke:video --workspace=@modo/api
      - name: Confirm API starts
        shell: bash
        run: |
          set -euo pipefail
          PORT=4052 NODE_ENV=test npm run start --workspace=@modo/api > "$RUNNER_TEMP/modo-api-startup.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4052/health >/dev/null; then exit 0; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat "$RUNNER_TEMP/modo-api-startup.log"; exit 1; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/modo-api-startup.log"
          exit 1
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit tree without scripts
        run: npm install --include=dev --ignore-scripts --no-audit --no-fund
      - name: Audit only MODO API runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --omit=dev --workspace=@modo/api --json > "$RUNNER_TEMP/api-audit.json"
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          node scripts/modo-api-security-audit.cjs "$RUNNER_TEMP/api-audit.json" "$RUNNER_TEMP/api-audit-summary.json"
      - name: Save sanitized audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modo-api-security-trial
          path: ${{ runner.temp }}/api-audit-summary.json
          retention-days: 2
          if-no-files-found: ignore
