name: MODO and SmartBots USA browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/USWorkspace.tsx'
      - 'apps/web/src/USWorkspace.css'
      - 'apps/web/src/Root.tsx'
      - 'scripts/usa-browser-smoke.mjs'
      - '.github/workflows/usa-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --include=dev
      - name: Install headless QA runner without touching manifests
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.57.0
      - name: Build production web assets
        run: npm run build --workspace=@modo/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run MODO and SmartBots USA browser QA
        run: node scripts/usa-browser-smoke.mjs
