name: Debug Canva typecheck

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug:
    if: github.head_ref == 'agent/canva-approved-export-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canva-approved-export-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > canva-typecheck.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> canva-typecheck.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: canva-typecheck
          path: canva-typecheck.log
          if-no-files-found: error
