name: Apply activation core

on:
  push:
    branches:
      - feat/activation-core-v1
    paths:
      - scripts/apply-activation-core.mjs
      - .github/workflows/apply-activation-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/activation-core-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-activation-core.mjs
      - name: Commit product changes
        run: |
          git config user.name "modo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/app.ts apps/web/src/main.tsx apps/web/src/Portal.tsx apps/web/src/OnboardingWorkspace.tsx apps/web/src/StudioWorkspace.tsx scripts/apply-activation-core.mjs .github/workflows/apply-activation-core.yml
          git commit -m "feat: guide and measure customer activation"
          git push origin HEAD:feat/activation-core-v1
