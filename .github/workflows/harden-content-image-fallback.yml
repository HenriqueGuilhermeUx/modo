name: Harden content image fallback

on:
  push:
    branches:
      - agent/content-engine-production-v1
    paths:
      - scripts/harden-content-image-fallback.mjs
      - .github/workflows/harden-content-image-fallback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-engine-production-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/harden-content-image-fallback.mjs
      - run: |
          git config user.name "MODO Product"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: preserve AI copy when image generation fails"
          git push origin HEAD:agent/content-engine-production-v1
