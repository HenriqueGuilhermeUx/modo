name: Apply embedded assets and Canva approval fix

on:
  push:
    branches:
      - fix/embedded-assets-and-canva-approval
    paths:
      - scripts/apply-embedded-assets-canva-fix.mjs
      - .github/workflows/apply-embedded-assets-canva-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/embedded-assets-and-canva-approval
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-embedded-assets-canva-fix.mjs
      - name: Commit clean result
        run: |
          git config user.name "modo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/app.ts apps/web/src/ContentWorkspace.tsx apps/web/src/CanvaApprovalAction.tsx scripts/apply-embedded-assets-canva-fix.mjs .github/workflows/apply-embedded-assets-canva-fix.yml
          git commit -m "fix: show generated images and automate approved Canva design"
          git push origin HEAD:fix/embedded-assets-and-canva-approval
