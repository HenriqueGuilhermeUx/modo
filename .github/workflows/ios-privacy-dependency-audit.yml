name: MODO privacy data-dependency static audit (read-only)

on:
  pull_request:
    paths:
      - 'scripts/privacy/audit-deletion-dependencies.mjs'
      - 'apps/api/src/**'
      - '.github/workflows/ios-privacy-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked code for data and integration dependencies
        run: node scripts/privacy/audit-deletion-dependencies.mjs
      - name: Upload source-only privacy inventory for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modo-privacy-dependency-audit
          path: |
            tmp/modo-privacy-source-inventory.json
            tmp/modo-privacy-table-review-matrix.csv
          retention-days: 14
          if-no-files-found: ignore
