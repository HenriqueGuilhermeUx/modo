name: Fix Studio image type

on:
  push:
    branches:
      - agent/content-engine-production-v1
    paths:
      - scripts/fix-studio-image-type.mjs
      - .github/workflows/fix-studio-image-type.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-engine-production-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-studio-image-type.mjs
      - run: |
          git config user.name "MODO Product"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: narrow generated image type in Studio"
          git push origin HEAD:agent/content-engine-production-v1
