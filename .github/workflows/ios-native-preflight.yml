name: MODO native iOS simulator preflight (unsigned)

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - '.github/workflows/ios-native-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modo-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Swift toolchain for Expo native dependencies
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -Eq 'Swift version (6[.][2-9]|[7-9][.])'
      - name: Install monorepo dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project (no credentials)
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install
      - name: Install native CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile unsigned iOS simulator application
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 2 -name '*.xcworkspace' -type d | head -1)"
          test -n "$WORKSPACE"
          export WORKSPACE
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild -list -workspace "$WORKSPACE"
          echo "Building app scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/modo-derived" build 2>&1 | tee ios-native-build.log
      - name: Install and launch on iPhone simulator
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/modo-derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          DEVICE_ID="$(xcrun simctl list devices available -j | node -e 'let x="";process.stdin.on("data",d=>x+=d);process.stdin.on("end",()=>{const ds=Object.values(JSON.parse(x).devices).flat();const d=ds.find(x=>x.isAvailable&&x.name.startsWith("iPhone"));if(!d)process.exit(1);console.log(d.udid)})')"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "Testing $BUNDLE_ID on $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/modo-ios-launch.png"
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl shutdown "$DEVICE_ID" || true
      - name: Upload simulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modo-ios-launch-screenshot
          path: ${{ runner.temp }}/modo-ios-launch.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modo-native-ios-log
          path: apps/mobile/ios-native-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unsigned simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: modo-ios-simulator-app
          path: ${{ runner.temp }}/modo-derived/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
