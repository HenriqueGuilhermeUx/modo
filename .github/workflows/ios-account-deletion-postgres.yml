name: MODO account deletion PostgreSQL staging-equivalent CI

on:
  pull_request:
    paths:
      - 'apps/api/src/services/auth-service.ts'
      - 'apps/api/src/services/account-deletion-postgres.test.ts'
      - 'apps/api/src/app.ts'
      - '.github/workflows/ios-account-deletion-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deletion-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: modo_deletion_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d modo_deletion_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      MODO_DELETION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/modo_deletion_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test durable authenticated deletion request with isolated PostgreSQL
        run: npm run test --workspace=@modo/api -- src/services/account-deletion-postgres.test.ts
