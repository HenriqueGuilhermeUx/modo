name: Apply owner unlimited and content recovery

on:
  push:
    branches:
      - agent/owner-unlimited-content-recovery
    paths:
      - scripts/apply-owner-unlimited-content-recovery.mjs
      - .github/workflows/apply-owner-unlimited-content-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/owner-unlimited-content-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-owner-unlimited-content-recovery.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: unlimited owner and resilient content production"
          git push origin HEAD:agent/owner-unlimited-content-recovery
