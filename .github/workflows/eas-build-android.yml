name: Build MODO Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Artefato Android"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      submit_to_play:
        description: "Enviar o AAB para a trilha interna da Google Play"
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-build-android.yml"
      - "apps/mobile/app.json"
      - "apps/mobile/eas.json"
      - "apps/mobile/package.json"
      - "package-lock.json"

concurrency:
  group: modo-android-eas-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android MODO
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "::error::EXPO_TOKEN ausente neste repositório." && exit 1)
          eas whoami

      - name: Install monorepo dependencies
        run: npm install --include=dev

      - name: Resolve app metadata
        id: app_meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          VERSION_CODE=$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")
          PACKAGE=$(node -p "require('./apps/mobile/app.json').expo.android.package")
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -ge 3
          test "$PACKAGE" = "br.com.alternativeventures.modo"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "MODO $VERSION | versionCode $VERSION_CODE | $PACKAGE"

      - name: Verify linked EAS project and credentials
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas project:info --non-interactive

      - name: Validate mobile project
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          npm run typecheck
          npx expo-doctor@latest
          rm -rf dist
          npx expo export --platform android --output-dir dist

      - name: Resolve profiles for this run
        id: profiles
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            push)
              echo "list=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "list=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build Android locally with EAS credentials
        id: eas_build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          EXPO_NO_TELEMETRY: "1"
          EAS_LOCAL_BUILD_SKIP_CLEANUP: "0"
          PROFILES: ${{ steps.profiles.outputs.list }}
          APP_VERSION: ${{ steps.app_meta.outputs.version }}
          VERSION_CODE: ${{ steps.app_meta.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          for PROFILE in $PROFILES; do
            if [ "$PROFILE" = "preview" ]; then
              FILE="$PWD/artifacts/MODO-$APP_VERSION-code-$VERSION_CODE-preview.apk"
            else
              FILE="$PWD/artifacts/MODO-$APP_VERSION-code-$VERSION_CODE-play-store.aab"
            fi

            echo "Compilando localmente $PROFILE para MODO $APP_VERSION, versionCode $VERSION_CODE..."
            rm -f "$FILE"
            eas build \
              --platform android \
              --profile "$PROFILE" \
              --non-interactive \
              --local \
              --output "$FILE"

            test -s "$FILE"
            sha256sum "$FILE" | tee "$FILE.sha256"
            ls -lh "$FILE"
          done

      - name: Upload Android artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MODO-Android-${{ steps.app_meta.outputs.version }}-code-${{ steps.app_meta.outputs.version_code }}-${{ github.run_number }}
          path: apps/mobile/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Submit production AAB to Google Play internal track
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'production' && inputs.submit_to_play == true
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: "1"
          APP_VERSION: ${{ steps.app_meta.outputs.version }}
          VERSION_CODE: ${{ steps.app_meta.outputs.version_code }}
        run: |
          AAB="artifacts/MODO-$APP_VERSION-code-$VERSION_CODE-play-store.aab"
          test -f "$AAB"
          eas submit \
            --platform android \
            --profile production \
            --path "$AAB" \
            --non-interactive
