[build]
  base = "."
  command = "npm run build --workspace=@modo/contracts && npm run build --workspace=@modo/api && npm run build --workspace=@modo/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://modo-api-3m10.onrender.com"

# "/" é servido pelo index.html pré-renderizado (arquivo existe, então a regra
# abaixo não se aplica). As demais rotas do SPA recebem o shell sem a landing.
[[redirects]]
  from = "/*"
  to = "/app-shell.html"
  status = 200
